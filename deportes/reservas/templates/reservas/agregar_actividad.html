<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Actividad Deportiva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barra de navegación con enlaces dinámicos -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'reservas:lista_actividades' %}">Deportes UNCA</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'reservas:lista_actividades' %}">Actividades</a>
                <a class="nav-link active" href="{% url 'reservas:agregar_actividad' %}">Nueva Actividad</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Bloque para mostrar mensajes de éxito o alerta de Django -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-success text-white">
                        <h4 class="mb-0">Registrar Nueva Actividad Deportiva</h4>
                    </div>
                    <div class="card-body">
                        <!-- Formulario con método POST y token CSRF obligatorio -->
                        <form method="POST">
                            {% csrf_token %}

                            {% for field in form %}
                            <div class="mb-3">
                                <label class="form-label font-weight-bold">{{ field.label }}</label>
                                {{ field }}
                                {% if field.errors %}
                                    <div class="text-danger small mt-1">
                                        {{ field.errors }}
                                    </div>
                                {% endif %}
                            </div>
                            {% endfor %}

                            <div class="d-flex justify-content-between mt-4">
                                <a href="{% url 'reservas:lista_actividades' %}" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-success">Guardar Actividad</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
